<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .l { opacity: 0; animation: print .35s ease-out forwards; }
    .grow { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: grow .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes print { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="399" height="199" fill="#151515" stroke="#e4e2e2"/>
  <g class="l" style="animation-delay:0.30s"><text x="25" y="35" class="title">Michael Kokaly's GitHub Stats</text></g>
    <g class="l" style="animation-delay:0.40s"><g transform="translate(25, 70)">
      <circle cx="6" cy="-5" r="4" fill="#79ff97"/>
      <text x="20" y="0" class="label">Total Stars Earned:</text>
      <text x="240" y="0" class="value">0</text>
    </g></g>
    <g class="l" style="animation-delay:0.50s"><g transform="translate(25, 95)">
      <circle cx="6" cy="-5" r="4" fill="#79ff97"/>
      <text x="20" y="0" class="label">Commits (2026):</text>
      <text x="240" y="0" class="value">162</text>
    </g></g>
    <g class="l" style="animation-delay:0.60s"><g transform="translate(25, 120)">
      <circle cx="6" cy="-5" r="4" fill="#79ff97"/>
      <text x="20" y="0" class="label">Total PRs:</text>
      <text x="240" y="0" class="value">0</text>
    </g></g>
    <g class="l" style="animation-delay:0.70s"><g transform="translate(25, 145)">
      <circle cx="6" cy="-5" r="4" fill="#79ff97"/>
      <text x="20" y="0" class="label">Total Issues:</text>
      <text x="240" y="0" class="value">0</text>
    </g></g>
    <g class="l" style="animation-delay:0.80s"><g transform="translate(25, 170)">
      <circle cx="6" cy="-5" r="4" fill="#79ff97"/>
      <text x="20" y="0" class="label">Contributed to (last year):</text>
      <text x="240" y="0" class="value">0</text>
    </g></g>
</svg>

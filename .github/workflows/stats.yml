name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/make-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Save cards
        run: |
          git config user.name "Michael Kokaly"
          git config user.email "212445133+MichaelKokal@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update stats cards"
          git push

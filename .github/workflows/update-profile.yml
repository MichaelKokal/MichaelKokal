name: Update profile

"on":
  schedule:
    - cron: "17 6 * * *"   # about 06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats cards
        run: node scripts/make-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Contribution stats panel
        run: |
          pip install -r scripts/requirements.txt
          python scripts/fetch_contributions.py
          python scripts/render_stats_svg.py

      # Commits as the Actions bot so the daily refresh doesn't add to my own contribution graph.
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats data/contributions.json stats-panel.svg
          git diff --cached --quiet || git commit -m "Update stats cards and contribution stats"
          git push
